

services:

  ## -------------------------------
  ## ✅   (Kafka with KRaft)
  ## -------------------------------
  kafka:
    image: bitnami/kafka:4.0.0 
    ports:
      - "9092:9092"
      - "9093:9093"
    env_file:
      - .env
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_KRAFT_CLUSTER_ID=MyKraftClusterId1234
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_MESSAGE_MAX_BYTES=${KAFKA_CFG_MESSAGE_MAX_BYTES}        
      - KAFKA_CFG_REPLICA_FETCH_MAX_BYTES=${KAFKA_CFG_MESSAGE_MAX_BYTES}   # match
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - kafka-net

  ## -------------------------------
  ## ✅   Consumers
  ## -------------------------------
  pg-consumer:
    build:
      context: ./consumers/pg-consumer
      dockerfile: Dockerfile
    container_name: pg-consumer
    environment:
      KAFKA_BROKER: kafka:9092 
      KAFKA_TOPIC: logs
    depends_on:
      - kafka
    networks:
      - kafka-net


  ## -------------------------------
  ## ✅   Producers
  ## -------------------------------

  grpc-producer:
    build:
      context: ./producers/grpc-producer
      dockerfile: Dockerfile
    container_name: grpc-server
    ports:
      - "50051:50051"
    environment:
      KAFKA_BROKER: kafka:9092 
      KAFKA_TOPIC: ${KAFKA_TOPICS}
    depends_on:
      - kafka
    networks:
      - kafka-net

networks:
  kafka-net:
    driver: bridge

volumes:
  kafka_data: