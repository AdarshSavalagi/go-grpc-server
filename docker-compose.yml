

services:

  ## -------------------------------
  ## ✅   (Kafka with KRaft)
  ## -------------------------------
  kafka-controller:
    image: bitnami/kafka:4.0.0
    container_name: kafka-controller
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_PROCESS_ROLES=controller
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_LISTENERS=CONTROLLER://0.0.0.0:9093
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka-controller:9093
      - KAFKA_KRAFT_CLUSTER_ID=KraftClusterId12345
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_HEAP_OPTS="-Xms1g -Xmx2g"
    ports:
      - "9093:9093"
    volumes:
      - kafka_data_controller:/bitnami/kafka
    networks:
      - kafka-net

  kafka-broker-1:
    image: bitnami/kafka:4.0.0
    container_name: kafka-broker-1
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_PROCESS_ROLES=broker
      - KAFKA_CFG_NODE_ID=2
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_LISTENERS=PLAINTEXT://0.0.0.0:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-broker-1:9092
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka-controller:9093
      - KAFKA_KRAFT_CLUSTER_ID=KraftClusterId12345
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_NUM_PARTITIONS=10
      - KAFKA_CFG_MESSAGE_MAX_BYTES=8388608                # 8MB per message
      - KAFKA_CFG_REPLICA_FETCH_MAX_BYTES=8388608          # 8MB fetch limit
      - KAFKA_CFG_LOG_RETENTION_BYTES=10737418240          # 10GB per partition
      - KAFKA_HEAP_OPTS="-Xms1g -Xmx2g"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data_broker_1:/bitnami/kafka
    networks:
      - kafka-net
    depends_on:
      - kafka-controller

  kafka-broker-2:
    image: bitnami/kafka:4.0.0
    container_name: kafka-broker-2
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_PROCESS_ROLES=broker
      - KAFKA_CFG_NODE_ID=3
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_LISTENERS=PLAINTEXT://0.0.0.0:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-broker-2:9094
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka-controller:9093
      - KAFKA_KRAFT_CLUSTER_ID=KraftClusterId12345
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_NUM_PARTITIONS=10
      - KAFKA_CFG_MESSAGE_MAX_BYTES=8388608                # 8MB per message
      - KAFKA_CFG_REPLICA_FETCH_MAX_BYTES=8388608          # 8MB fetch limit
      - KAFKA_CFG_LOG_RETENTION_BYTES=10737418240          # 10GB per partition
      - KAFKA_HEAP_OPTS="-Xms1g -Xmx2g"
    ports:
      - "9094:9094"
    volumes:
      - kafka_data_broker_2:/bitnami/kafka
    networks:
      - kafka-net
    depends_on:
      - kafka-controller

  ## -------------------------------
  ## ✅   Consumers
  ## -------------------------------
  pg-consumer:
    build:
      context: ./consumers/pg-consumer
      dockerfile: Dockerfile
    container_name: pg-consumer
    depends_on:
      - kafka-controller
    networks:
      - kafka-net


  ## -------------------------------
  ## ✅   Producers
  ## -------------------------------

  grpc-producer:
    build:
      context: ./producers/grpc-producer
      dockerfile: Dockerfile
    deploy:
      replicas: 3
    depends_on:
      - kafka-controller
    ports:
      - "50051-50053:50051"
    networks:
      - kafka-net

networks:
  kafka-net:
    driver: bridge

volumes:
  kafka_data_controller:
  kafka_data_broker_1:
  kafka_data_broker_2: