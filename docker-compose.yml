version: '3.8'

services:

  ## -------------------------------
  ## ✅   (Kafka with KRaft - Combined Controller & Broker)
  ## -------------------------------
  kafka:
    image: bitnami/kafka:4.0.0 
    ports:
      - "9092:9092"
      - "9093:9093"
    env_file:
      - .env
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_KRAFT_CLUSTER_ID=MyKraftClusterId1234
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      # Buffer Sizes (Maximizing)
      - KAFKA_CFG_MESSAGE_MAX_BYTES=104857600 # 100MB (adjust as needed, max might depend on system limits)
      - KAFKA_CFG_REPLICA_FETCH_MAX_BYTES=104857600 # Match message max bytes
      - KAFKA_CFG_FETCH_MAX_BYTES=104857600   # Consumer fetch max (adjust consumer-side as well)
      - KAFKA_CFG_BUFFER_MEMORY=419430400      # 400MB for producer buffers (adjust JVM heap and needs)
      - KAFKA_CFG_SOCKET_SEND_BUFFER_BYTES=-1 # Use OS default (potentially max)
      - KAFKA_CFG_SOCKET_RECEIVE_BUFFER_BYTES=-1 # Use OS default (potentially max)
      # Kafka Storage (Maximum within Volume)
      - KAFKA_CFG_LOG_RETENTION_BYTES=-1      # Retain all logs indefinitely (within disk space)
      # TTL (Time-To-Live) - Configured per topic
      - KAFKA_CFG_LOG_RETENTION_MS=1200000     # 20 minutes in milliseconds (20 * 60 * 1000)
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - kafka-net

  ## -------------------------------
  ## ✅   Consumers
  ## -------------------------------
  pg-consumer:
    build:
      context: ./consumers/pg-consumer
      dockerfile: Dockerfile
    container_name: pg-consumer
    depends_on:
      - kafka
    networks:
      - kafka-net


  ## -------------------------------
  ## ✅   Producers
  ## -------------------------------

  grpc-producer:
    build:
      context: ./producers/grpc-producer
      dockerfile: Dockerfile
    deploy:
      replicas: 3
    depends_on:
      - kafka
    ports:
      - "50051-50053:50051"
    networks:
      - kafka-net

networks:
  kafka-net:
    driver: bridge

volumes:
  kafka_data: