version: "3.8"

services:
  ## -------------------------------
  ## ✅ INTEL PROFILE (Kafka with KRaft)
  ## -------------------------------
  broker:
    image: apache/kafka:latest
    container_name: broker
    profiles: ["intel"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - kafka-net

  ## -------------------------------
  ## ✅ ARM PROFILE (Kafka + Zookeeper using Bitnami)
  ## -------------------------------
  zookeeper:
    image: bitnami/zookeeper:3.8
    container_name: zookeeper
    profiles: ["arm"]
    ports:
      - "2181:2181"
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    networks:
      - kafka-net

  kafka-bitnami:
    image: bitnami/kafka:3.7.0
    container_name: kafka-bitnami
    profiles: ["arm"]
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_CFG_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-bitnami:9092
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    networks:
      - kafka-net

  ## -------------------------------
  ## ✅ Go gRPC Server (common for both profiles)
  ## -------------------------------
  grpc-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grpc-server
    ports:
      - "50051:50051"
    environment:
      KAFKA_BROKER: kafka-bitnami:9092 # ARM (Bitnami)
      KAFKA_TOPIC: logs
    depends_on:
      - kafka-bitnami
    networks:
      - kafka-net
    profiles: ["arm"]

  grpc-server-intel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grpc-server
    ports:
      - "50051:50051"
    environment:
      KAFKA_BROKER: broker:9092 # Intel (KRaft)
      KAFKA_TOPIC: logs
    depends_on:
      - broker
    networks:
      - kafka-net
    profiles: ["intel"]

networks:
  kafka-net:
    driver: bridge
